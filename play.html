<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Isle — Detective</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b12; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; display: inline-block; line-height: normal; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; display: block; }
  .hidden { display: none !important; }
  #solveBtn {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    font-family: monospace; font-size: 13px; padding: 8px 14px;
    background: #3f6f3f; color: #f2e8c8; border: 1px solid #6fbf58;
    border-radius: 3px; cursor: pointer; white-space: nowrap;
  }
  #solveBtn:hover { background: #4f8f4f; }
  #modal {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.65);
  }
  #modalBox {
    background: #14141d; border: 1px solid #3a3a4a; padding: 14px; width: 78%; max-width: 440px;
    color: #f2e8c8; font-family: monospace; font-size: 12px; box-sizing: border-box;
  }
  #modalBox h3 { margin: 0 0 8px; color: #ffd24a; font-size: 13px; letter-spacing: 1px; }
  #modalBox textarea {
    width: 100%; height: 74px; background: #1c1c27; color: #f2e8c8; border: 1px solid #3a3a4a;
    font-family: monospace; font-size: 12px; box-sizing: border-box; padding: 6px; resize: vertical;
  }
  #modalBox .row { display: flex; gap: 8px; margin-top: 8px; }
  #modalBox button {
    font-family: monospace; font-size: 12px; padding: 6px 12px; background: #23232f;
    color: #f2e8c8; border: 1px solid #3a3a4a; cursor: pointer; border-radius: 2px;
  }
  #modalBox button:hover { background: #2e2e3d; }
  #modalNote { margin-top: 8px; color: #8a8a9a; font-size: 11px; line-height: 1.5; }
  #toast {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
    background: rgba(10,8,16,0.92); color: #ffd24a; font-family: monospace; font-size: 12px;
    padding: 6px 10px; border: 1px solid #c9a25c; border-radius: 3px; opacity: 0;
    transition: opacity .3s; pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; }
  .lookSelect {
    position: absolute; top: 30px; right: 10px; font-family: monospace; font-size: 11px;
    background: #1c1c2a; color: #f2e8c8; border: 1px solid #3a3a4a; padding: 2px 4px; border-radius: 2px;
  }
  #hud { position: absolute; inset: 0; pointer-events: none; font-family: monospace; }
  #hudScene { position: absolute; top: 8px; left: 10px; font-size: 14px; font-weight: bold; color: #ffd24a; letter-spacing: 1px; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
  #hudClues { position: absolute; top: 29px; left: 10px; font-size: 12px; color: #f2e8c8; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
  #hudHint { position: absolute; top: 9px; right: 10px; font-size: 11px; color: #d8d8e0; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
  #dialogue {
    position: absolute; left: 8px; right: 8px; bottom: 52px;
    background: rgba(10,8,16,0.94); border: 1px solid #e0bd79; border-radius: 3px;
    padding: 10px 12px; font-family: monospace; color: #f2e8c8; font-size: 13px;
    line-height: 1.45; pointer-events: none;
  }
  #dialogueHint { margin-top: 6px; text-align: right; color: #c9a25c; font-size: 11px; }
  #articleBox {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6); cursor: pointer;
  }
  #articleInner {
    background: #efe6d0; color: #2a2418; border: 2px solid #8a6d3b; border-radius: 3px;
    padding: 14px 16px; width: 72%; max-width: 420px; max-height: 72%; overflow: auto;
    font-family: Georgia, serif; font-size: 12px; line-height: 1.5; cursor: default;
  }
  #articleHeadline { font-weight: bold; font-size: 14px; margin-bottom: 8px; }
  #articleHint { margin-top: 10px; text-align: right; color: #8a6d3b; font-size: 10px; font-family: monospace; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="hudScene">HOME ROOM</div>
    <div id="hudClues"></div>
    <div id="hudHint">WASD move &middot; E interact</div>
  </div>
  <div id="dialogue" class="hidden">
    <div id="dialogueText"></div>
    <div id="dialogueHint">E to continue</div>
  </div>
  <div id="articleBox" class="hidden">
    <div id="articleInner">
      <div id="articleHeadline"></div>
      <div id="articleText"></div>
      <div id="articleHint">E or click to put down the paper</div>
    </div>
  </div>
  <button id="solveBtn" class="hidden">Explain the death</button>
  <select id="lookSelect" class="lookSelect" title="Player look">
    <option value="Percy">Percy</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
  </select>
  <div id="modal" class="hidden">
    <div id="modalBox">
      <h3>WHY DID THE VICTIM DIE?</h3>
      <textarea id="answerText" placeholder="Type your conclusion..."></textarea>
      <div class="row">
        <button id="submitAnswer">Submit</button>
        <button id="cancelAnswer">Cancel</button>
      </div>
      <div id="modalNote"></div>
    </div>
  </div>
  <div id="toast"></div>
</div>
<script src="case_data.js"></script>
<script src="case_demo.js"></script>
<script src="game.js"></script>
<script>
(function () {
  "use strict";
  var PI = window.PI;

  var PLACEHOLDER_CASE = {
    title: "PIXEL ISLE DAILY — placeholder case",
    article: {
      headline: "Mysterious death at the lighthouse",
      text: "This is a placeholder case. Run generate_case.py to turn today's BBC news into a real case. In the meantime, a fictional victim was found at the lighthouse at dawn. Witnesses reported a strange light in the window the night before. The victim's chair held a torn note. A page was missing from the lighthouse ledger on the bookshelf. A picture of the victim and the keeper hangs above the fireplace."
    },
    questions: [
      { object: "Dead body", question: "How did the victim die?", options: ["Fell from the cliff", "Poisoned", "Drowned", "Old age"], answer: 1 },
      { object: "Picture", question: "Who is in the picture?", options: ["The victim and the keeper", "Two strangers", "The mayor", "Nobody"], answer: 0 },
      { object: "Chair", question: "What was found on the chair?", options: ["A hat", "A torn note", "A key", "Nothing"], answer: 1 },
      { object: "Bookshelf", question: "What was missing from the ledger?", options: ["The cover", "A page", "The whole book", "Nothing"], answer: 1 },
      { object: "Night window", question: "What was seen at night?", options: ["A boat", "A strange light", "A shadow", "Nothing"], answer: 1 }
    ],
    solution: "The victim was poisoned — a placeholder solution. Run generate_case.py for a case built from a real BBC story.",
    key_terms: ["poisoned", "lighthouse", "keeper"]
  };
  var CASE = window.CASE || PLACEHOLDER_CASE;
  var IS_DEMO = location.search.indexOf("demo") >= 0;
  if (IS_DEMO && window.CASE_DEMO) CASE = window.CASE_DEMO;

  var canvas = document.getElementById("game");
  var TILE = PI.TILE;
  var VIEW_W = PI.VIEW_W;
  var VIEW_H = PI.VIEW_H;
  var RENDER_SCALE = 2;

  canvas.width = VIEW_W * RENDER_SCALE;
  canvas.height = VIEW_H * RENDER_SCALE;
  var ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(RENDER_SCALE, 0, 0, RENDER_SCALE, 0, 0);

  var S = PI.initStore();
  var scenes = S.scenes;
  var npcData = S.npcData;
  var signData = S.signData;

  var look = "Percy";
  try { look = localStorage.getItem("pixelisle.look") || "Percy"; } catch (e) {}
  var lookSelect = document.getElementById("lookSelect");
  if (lookSelect) {
    lookSelect.value = look;
    lookSelect.addEventListener("change", function () {
      look = lookSelect.value;
      try { localStorage.setItem("pixelisle.look", look); } catch (e) {}
    });
  }

  function norm(s) { return (s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }

  function pickScene(candidates, exclude) {
    var names = Object.keys(scenes);
    for (var c = 0; c < candidates.length; c++) {
      for (var i = 0; i < names.length; i++) {
        if (names[i] === exclude) continue;
        if (norm(names[i]) === candidates[c]) return names[i];
      }
    }
    for (var c2 = 0; c2 < candidates.length; c2++) {
      for (var j = 0; j < names.length; j++) {
        if (names[j] === exclude) continue;
        if (norm(names[j]).indexOf(candidates[c2]) >= 0) return names[j];
      }
    }
    return null;
  }

  var homeName = pickScene(["homeroom", "home", "startroom", "start", "room"]) || Object.keys(scenes)[0];
  var murderName = pickScene(["murderscene", "mudersence", "muderscene", "murdersence", "murder", "muder", "crime", "crimescene"], homeName);
  if (!murderName) {
    var ks = Object.keys(scenes).filter(function (k) { return k !== homeName; });
    murderName = ks.length ? ks[0] : homeName;
  }

  var current = homeName;
  var world = PI.rowsToWorld(scenes[current]);
  var ent = PI.rebuild(world, npcData);

  var state = "play";
  var dialogue = null;
  var dialIndex = 0;
  var keys = {};
  var player = { x: ent.spawn.x, y: ent.spawn.y, dir: "down", moving: false, frame: 0 };

  var investigation = {
    started: false,
    solved: false,
    answer: "",
    clues: [],
    seen: {},
    articleRead: false,
    qDone: {},
    qCorrect: 0
  };

  var mcq = null;
  var articleOpen = false;

  var doorCooldown = 0;

  var solveBtn = document.getElementById("solveBtn");
  var modal = document.getElementById("modal");
  var toastEl = document.getElementById("toast");
  var modalNote = document.getElementById("modalNote");
  var answerText = document.getElementById("answerText");
  var hudSceneEl = document.getElementById("hudScene");
  var hudCluesEl = document.getElementById("hudClues");
  var dialogueEl = document.getElementById("dialogue");
  var dialogueTextEl = document.getElementById("dialogueText");
  var dialogueHintEl = document.getElementById("dialogueHint");
  var articleEl = document.getElementById("articleBox");
  var articleHeadlineEl = document.getElementById("articleHeadline");
  var articleTextEl = document.getElementById("articleText");

  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
  }

  function isMurder() { return current === murderName; }

  function updateHUD() {
    hudSceneEl.textContent = isMurder() ? ("MURDER SCENE" + (IS_DEMO ? " (DEMO)" : "")) : "HOME ROOM";
    if (isMurder()) {
      var total = CASE.questions.length;
      var answered = Object.keys(investigation.qDone).length;
      var read = investigation.articleRead ? " \u00b7 News read" : "";
      hudCluesEl.textContent = "Questions " + answered + "/" + total + " answered \u00b7 " +
        investigation.qCorrect + " correct" + read;
    } else {
      hudCluesEl.textContent = "";
    }
  }

  function updateDialogueDom() {
    if (dialogue) {
      dialogueEl.classList.remove("hidden");
      dialogueTextEl.textContent = dialogue[dialIndex] || "";
    } else {
      dialogueEl.classList.add("hidden");
    }
  }

  function refreshUI() {
    solveBtn.classList.toggle("hidden", !isMurder());
    if (!isMurder()) modal.classList.add("hidden");
    updateHUD();
  }

  function goTo(name) {
    current = name;
    world = PI.rowsToWorld(scenes[name]);
    ent = PI.rebuild(world, npcData);
    player.x = ent.spawn.x; player.y = ent.spawn.y;
    player.dir = "down"; player.moving = false; player.frame = 0;
    dialogue = null; mcq = null; articleOpen = false;
    articleEl.classList.add("hidden");
    updateDialogueDom();
    doorCooldown = 0.5;
    refreshUI();
  }

  function useDoor() {
    if (current === homeName) {
      investigation.started = true;
      goTo(murderName);
      toast("The investigation begins — find out why the victim died.");
    } else if (current === murderName) {
      goTo(homeName);
      toast("You returned to the home room.");
    }
  }

  window.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    var typing = e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT");
    if (k === "escape") { modal.classList.add("hidden"); if (articleOpen) closeArticle(); keys = {}; return; }
    if (typing) return;
    if (mcq && mcq.chosen === null && k >= "1" && k <= "4") { answerMcq(+k - 1); e.preventDefault(); return; }
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].indexOf(k) >= 0) e.preventDefault();
    keys[k] = true;
    if (k === "e" || k === "enter" || k === " ") interact();
  });
  window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });

  function solidAt(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= ent.W || ty >= ent.H) return true;
    var c = world[ty][tx];
    if (c === "D") return false;
    if (PI.SOLID_BASE[c]) return true;
    return false;
  }
  function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }
  function collides(x, y, w, h) {
    var x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 1) / TILE);
    var y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 1) / TILE);
    for (var ty = y0; ty <= y1; ty++)
      for (var tx = x0; tx <= x1; tx++)
        if (solidAt(tx, ty)) return true;
    for (var i = 0; i < ent.npcs.length; i++) {
      var n = ent.npcs[i];
      if (rectHit(x, y, w, h, n.x, n.y, n.w, n.h)) return true;
    }
    return false;
  }

  var speed = 70, PH = 8, PW = 10, OX = 3, OY = 8;

  var INSPECT = { j: 1, k: 1, l: 1, m: 1, n: 1, K: 1, L: 1, G: 1, H: 1, J: 1, E: 1, Q: 1, A: 1, B: 1, x: 1, t: 1, y: 1, V: 1, c: 1, M: 1, I: 1, O: 1, e: 1, p: 1, d: 1 };

  function labelFor(c) {
    for (var i = 0; i < PI.PALETTE.length; i++) if (PI.PALETTE[i].c === c) return PI.PALETTE[i].label;
    return "object";
  }

  function findNearInspect(radius) {
    var px = Math.floor((player.x + 8) / TILE), py = Math.floor((player.y + 8) / TILE);
    var best = null, bestD = 1e9;
    for (var oy = -radius; oy <= radius; oy++)
      for (var ox = -radius; ox <= radius; ox++) {
        var tx = px + ox, ty = py + oy;
        if (tx < 0 || ty < 0 || tx >= ent.W || ty >= ent.H) continue;
        var c = world[ty][tx];
        if (INSPECT[c]) {
          var d = ox * ox + oy * oy;
          if (d < bestD) { bestD = d; best = { x: tx, y: ty, c: c }; }
        }
      }
    return best;
  }

  function update(dt) {
    if (dialogue || mcq || articleOpen || !modal.classList.contains("hidden")) return;
    if (doorCooldown > 0) doorCooldown -= dt;

    var dx = 0, dy = 0;
    if (keys["a"] || keys["arrowleft"]) dx = -1;
    if (keys["d"] || keys["arrowright"]) dx = 1;
    if (keys["w"] || keys["arrowup"]) dy = -1;
    if (keys["s"] || keys["arrowdown"]) dy = 1;
    player.moving = (dx !== 0 || dy !== 0);
    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
    if (dx !== 0) {
      var nx = player.x + dx * speed * dt;
      if (!collides(nx + OX, player.y + OY, PW, PH)) player.x = nx;
      player.dir = dx < 0 ? "left" : "right";
    }
    if (dy !== 0) {
      var ny = player.y + dy * speed * dt;
      if (!collides(player.x + OX, ny + OY, PW, PH)) player.y = ny;
      if (dx === 0) player.dir = dy < 0 ? "up" : "down";
    }
    if (player.moving) player.frame = (Math.floor(performance.now() / 150)) % 2;
    else player.frame = 0;

    var fcx = Math.floor((player.x + 8) / TILE), fcy = Math.floor((player.y + 12) / TILE);
    if (doorCooldown <= 0 && world[fcy] && world[fcy][fcx] === "D") useDoor();
  }

  function findNearTile(ch, radius) {
    var px = Math.floor((player.x + 8) / TILE), py = Math.floor((player.y + 8) / TILE);
    for (var oy = -radius; oy <= radius; oy++)
      for (var ox = -radius; ox <= radius; ox++) {
        var tx = px + ox, ty = py + oy;
        if (tx < 0 || ty < 0 || tx >= ent.W || ty >= ent.H) continue;
        if (world[ty][tx] === ch) return { x: tx, y: ty };
      }
    return null;
  }

  function showQuestion(q) {
    mcq = { q: q, chosen: null };
    renderMcqDom();
  }

  function renderMcqDom() {
    if (!mcq) return;
    var q = mcq.q;
    var txt = "[" + q.object + "] " + q.question + "\n" +
      q.options.map(function (o, i) { return (i + 1) + ") " + o; }).join("\n");
    if (mcq.chosen !== null) {
      var ok = mcq.chosen === q.answer;
      txt += "\n\n" + (ok ? "\u2713 Correct!" :
        "\u2717 Wrong \u2014 the answer was " + (q.answer + 1) + ") " + q.options[q.answer] + ".");
    }
    dialogueTextEl.textContent = txt;
    dialogueHintEl.textContent = mcq.chosen === null ? "Press 1-4 to answer" : "E to continue";
    dialogueEl.classList.remove("hidden");
  }

  function answerMcq(i) {
    var q = mcq.q;
    var ok = i === q.answer;
    if (ok) investigation.qCorrect++;
    mcq.chosen = i;
    renderMcqDom();
    updateHUD();
    toast(ok ? "Correct!" : "Wrong answer");
  }

  function openArticle() {
    articleOpen = true;
    articleHeadlineEl.textContent = CASE.article.headline;
    articleTextEl.textContent = CASE.article.text;
    articleEl.classList.remove("hidden");
    if (!investigation.articleRead) {
      investigation.articleRead = true;
      toast("You read the news.");
      updateHUD();
    }
  }

  function closeArticle() {
    articleOpen = false;
    articleEl.classList.add("hidden");
  }

  function findQuestionFor(label) {
    for (var i = 0; i < CASE.questions.length; i++) {
      var q = CASE.questions[i];
      if (q.object === label && !investigation.qDone[i]) return i;
    }
    return -1;
  }

  function hasAnswered(label) {
    for (var j = 0; j < CASE.questions.length; j++)
      if (CASE.questions[j].object === label && investigation.qDone[j]) return true;
    return false;
  }

  function interact() {
    if (dialogue) { dialIndex++; if (dialIndex >= dialogue.length) dialogue = null; updateDialogueDom(); return; }
    if (articleOpen) { closeArticle(); return; }
    if (mcq) {
      if (mcq.chosen === null) return;
      mcq = null;
      dialogueEl.classList.add("hidden");
      return;
    }
    if (modal.classList.contains("hidden") === false) return;
    for (var i = 0; i < ent.npcs.length; i++) {
      var n = ent.npcs[i];
      var dx = (n.x + 8) - (player.x + 8), dy = (n.y + 8) - (player.y + 8);
      if (dx * dx + dy * dy < 28 * 28) { openDialogue(n.lines); return; }
    }
    if (isMurder()) {
      var obj = findNearInspect(2);
      if (obj) {
        var lbl = labelFor(obj.c);
        if (lbl === "Papers (rug)") { openArticle(); return; }
        var qi = findQuestionFor(lbl);
        if (qi >= 0) {
          investigation.qDone[qi] = true;
          investigation.clues.push(obj.x + "," + obj.y);
          updateHUD();
          showQuestion(CASE.questions[qi]);
        } else if (hasAnswered(lbl)) {
          openDialogue(["You've already examined the " + lbl + "."]);
        } else {
          openDialogue(["You examine the " + lbl + ". Nothing of note."]);
        }
        return;
      }
    }
    var sign = findNearTile("S", 2);
    if (sign) { openDialogue([signData[sign.x + "," + sign.y] || "Nothing written here."]); return; }
  }

  function openDialogue(lines) { dialogue = lines; dialIndex = 0; updateDialogueDom(); }

  var camX = 0, camY = 0;

  function render() {
    ctx.fillStyle = "#0b0b12";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    camX = Math.max(0, Math.min(player.x + 8 - VIEW_W / 2, ent.PXW - VIEW_W));
    camY = Math.max(0, Math.min(player.y - VIEW_H / 2, ent.PXH - VIEW_H));

    var tx0 = Math.floor(camX / TILE), ty0 = Math.floor(camY / TILE);
    var tx1 = Math.ceil((camX + VIEW_W) / TILE), ty1 = Math.ceil((camY + VIEW_H) / TILE);
    for (var ty = ty0; ty <= ty1; ty++)
      for (var tx = tx0; tx <= tx1; tx++) {
        if (tx < 0 || ty < 0 || tx >= ent.W || ty >= ent.H) continue;
        PI.drawTile(ctx, world[ty][tx], tx, ty, tx * TILE - camX, ty * TILE - camY, false, ent.ground);
      }

    PI.drawBigChairs(ctx, world, tx0, ty0, tx1, ty1, camX, camY);

    var ents = [{ y: player.y, draw: function () { PI.drawPlayerLook(ctx, look, player.dir, player.frame, player.x - camX, player.y - camY); } }];
    for (var i = 0; i < ent.npcs.length; i++) {
      (function (n) { ents.push({ y: n.y, draw: function () { PI.drawChar(ctx, n.frames[0], n.x - camX, n.y - camY); } }); })(ent.npcs[i]);
    }
    ents.sort(function (a, b) { return a.y - b.y; });
    for (var j = 0; j < ents.length; j++) ents[j].draw();

  }

  function scoreKeywords(ans) {
    var a = norm(ans);
    var n = 0;
    for (var i = 0; i < CASE.key_terms.length; i++)
      if (a.indexOf(norm(CASE.key_terms[i])) >= 0) n++;
    return n;
  }

  solveBtn.addEventListener("click", function () {
    if (!isMurder()) return;
    keys = {};
    var total = CASE.questions.length;
    modalNote.textContent = "Questions correct: " + investigation.qCorrect + "/" + total +
      (investigation.articleRead ? " \u00b7 News read" : " \u00b7 News NOT read");
    answerText.value = investigation.answer || "";
    modal.classList.remove("hidden");
    answerText.focus();
  });
  document.getElementById("cancelAnswer").addEventListener("click", function () {
    keys = {};
    modal.classList.add("hidden");
  });
  document.getElementById("submitAnswer").addEventListener("click", function () {
    var txt = answerText.value.trim();
    if (!txt) { answerText.focus(); return; }
    var matched = scoreKeywords(txt);
    var total = CASE.questions.length;
    investigation.answer = txt;
    investigation.solved = true;
    keys = {};
    modal.classList.add("hidden");
    openDialogue([
      "Your conclusion: \u201c" + txt.slice(0, 70) + (txt.length > 70 ? "\u2026" : "") + "\u201d",
      "SCORE \u2014 questions " + investigation.qCorrect + "/" + total +
        " correct \u00b7 answer keywords " + matched + "/" + CASE.key_terms.length,
      "THE TRUTH: " + CASE.solution,
      "Case: " + (CASE.title || "today's news")
    ]);
  });

  articleEl.addEventListener("click", function () { closeArticle(); });

  function resize() {
    var s = Math.max(1, Math.floor(Math.min(window.innerWidth / VIEW_W, window.innerHeight / VIEW_H)));
    canvas.style.width = (VIEW_W * s) + "px";
    canvas.style.height = (VIEW_H * s) + "px";
  }
  window.addEventListener("resize", resize);
  resize();
  refreshUI();

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
