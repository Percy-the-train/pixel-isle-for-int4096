services:
  newscrawler:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data
    environment:
      # Optional: keys from environment variables (never shown in the UI)
      - NEWSCRAWLER_GUARDIAN_KEY=${NEWSCRAWLER_GUARDIAN_KEY:-}
      - NEWSCRAWLER_NEWSAPI_KEY=${NEWSCRAWLER_NEWSAPI_KEY:-}
      - NEWSCRAWLER_GNEWS_KEY=${NEWSCRAWLER_GNEWS_KEY:-}
      - NEWSCRAWLER_NYT_KEY=${NEWSCRAWLER_NYT_KEY:-}