<!DOCTYPE html>
<html lang="zh-HK"><head><meta charset="utf-8"><title>News Sentence Labeler</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:20px auto;padding:0 12px;color:#222}
fieldset{margin:12px 0;border:1px solid #ccc;border-radius:8px}
label{display:inline-block;margin:4px 12px 4px 0}
input,select{padding:4px}button{padding:6px 14px;margin-right:6px;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #ddd;padding:4px;vertical-align:top}
.l0{background:#f3f3f3}.l1{background:#ffe9b3}.l2{background:#d6ecff}
#log{font-size:13px;color:#555;white-space:pre-wrap;max-height:120px;overflow:auto}
</style></head><body>
<h2>新聞句子標註工具</h2>
<fieldset><legend>1. 資料集</legend>
<input type="file" id="file" accept=".csv">
<label>內容欄位 <select id="colText"></select></label>
<label>標題欄位 <select id="colTitle"></select></label>
<label>只用 split = <select id="colSplit"></select></label>
<div id="info"></div></fieldset>
<fieldset><legend>2. 資料清洗</legend>
<label><input type="checkbox" id="cHtml" checked>移除 HTML</label>
<label><input type="checkbox" id="cEll" checked>移除截斷用的「...」</label>
<label><input type="checkbox" id="cWs" checked>合併空白</label>
<label><input type="checkbox" id="cDup" checked>刪除重複文章</label>
<label>文章最少字數 <input type="number" id="cMin" value="50" style="width:70px"></label>
<label>句子最少字數 <input type="number" id="cSMin" value="15" style="width:60px"></label>
<button id="btnClean">執行清洗並斷句</button></fieldset>
<fieldset><legend>3. AI 供應商</legend>
<label>供應商 <select id="prov"></select></label>
<label>Base URL <input id="url" size="42"></label><br>
<label>模型 <input id="model" size="28"></label>
<label>API Key <input id="key" type="password" size="36"></label><br>
<label>延遲(ms,可選) <input type="number" id="delay" value="1000" style="width:80px"></label>
<label>同時請求數 <input type="number" id="batch" value="1" style="width:60px"></label>
<label>重試次數 <input type="number" id="retry" value="2" style="width:50px"></label>
<br><label>系統提示詞(可修改)<br><textarea id="prompt" rows="9" style="width:100%"></textarea></label>
</fieldset>
<fieldset><legend>4. 執行</legend>
<button id="btnRun">開始 / 繼續 AI 標註</button><button id="btnStop">暫停</button>
<button id="btnCsv">匯出句子 CSV</button><button id="btnJson">匯出 JSONL</button>
<progress id="bar" value="0" max="1" style="width:200px"></progress> <span id="pt"></span>
<div id="log"></div></fieldset>
<div id="view"></div>
<script>
const PROVIDERS={
 openai:{url:"https://api.openai.com/v1/chat/completions",model:"gpt-4o-mini"},
 claude:{url:"https://api.anthropic.com/v1/messages",model:"claude-sonnet-4-5",type:"anthropic"},
 gemini:{url:"https://generativelanguage.googleapis.com/v1beta/openai/chat/completions",model:"gemini-2.5-flash"},
 deepseek:{url:"https://api.deepseek.com/chat/completions",model:"deepseek-chat"},
 grok:{url:"https://api.x.ai/v1/chat/completions",model:"grok-4"},
 openrouter:{url:"https://openrouter.ai/api/v1/chat/completions",model:"openai/gpt-4o-mini"},
 poe:{url:"https://api.poe.com/v1/chat/completions",model:"GPT-4o-Mini"},
 custom:{url:"",model:""}
};
const META=["id","author","published","category","language","source","url","split"];
const DEFAULT_PROMPT=`你是新聞標註助手。我會給你一篇新聞的編號句子,請為每一句標註:
0 = 可有可無:空泛、對全文沒有太大用途、只是充實語法或過渡的句子。
1 = 論點和中心句:新聞主題、發生的核心事件或關鍵事實(例如火災的處理時間、傷亡人數)。
2 = 證據或附帶資訊:次要但重要的資訊(例如當事人/市民看法、要求問責、引述、影響如交通受阻等)。
只輸出 JSON 陣列,格式 [{"id":1,"label":0},...],必須涵蓋所有句子編號,不要任何解釋。`;
const $=id=>document.getElementById(id);
let rows=[],articles=[],stop=false;
$("prompt").value=DEFAULT_PROMPT;
for(const k in PROVIDERS)$("prov").add(new Option(k,k));
function setProv(){const p=PROVIDERS[$("prov").value];$("url").value=p.url;$("model").value=p.model;$("key").value=localStorage.getItem("key_"+$("prov").value)||""}
$("prov").onchange=setProv;setProv();
$("key").onchange=()=>localStorage.setItem("key_"+$("prov").value,$("key").value);
$("file").onchange=e=>{
 Papa.parse(e.target.files[0],{header:true,skipEmptyLines:true,complete:r=>{
  rows=r.data;const cols=r.meta.fields;
  ["colText","colTitle","colSplit"].forEach(i=>$(i).innerHTML="");
  $("colTitle").add(new Option("(無)",""));
  cols.forEach(c=>{$("colText").add(new Option(c,c));$("colTitle").add(new Option(c,c))});
  $("colSplit").add(new Option("(全部)",""));
  if(cols.includes("split")){[...new Set(rows.map(x=>x.split))].forEach(v=>$("colSplit").add(new Option(v,v)))}
  if(cols.includes("text"))$("colText").value="text";
  if(cols.includes("title"))$("colTitle").value="title";
  $("info").textContent=`${rows.length} 行;欄位:${cols.join(", ")}。注意:原有的 label 欄位不會被覆蓋,新標籤會存成 sentence_label。`;
 }});
};
const ABBR=/\b(Mr|Mrs|Ms|Dr|Prof|St|Sr|Jr|vs|U\.S|U\.K|No|Inc|Ltd|Co|Gen|Col|Lt|Sen|Rep|Gov)\.$/;
function splitSentences(t){
 const out=[];
 t.split(/\n+/).forEach(par=>{
  par=par.trim();if(!par)return;
  const re=/[^。!?!?;;]+[。!?!?;;]*|[^。!?!?;;]+$/g;
  let chunks=[];
  par.split(/(?<=[.!?]["”'’)]?)\s+(?=["“'‘(]?[A-Z0-9])/).forEach(p=>{
   if(chunks.length&&ABBR.test(chunks[chunks.length-1]))chunks[chunks.length-1]+=" "+p;else chunks.push(p);
  });
  chunks.forEach(c=>{(c.match(re)||[c]).forEach(s=>{s=s.trim();if(s)out.push(s)})});
 });
 return out;
}
$("btnClean").onclick=()=>{
 const col=$("colText").value,tc=$("colTitle").value,sp=$("colSplit").value;if(!col)return alert("請先上傳 CSV");
 const seen=new Set();articles=[];
 rows.forEach((r,i)=>{
  if(sp&&r.split!==sp)return;
  let t=String(r[col]||"");
  if($("cHtml").checked)t=t.replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&");
  if($("cEll").checked)t=t.replace(/\.{3}(?=\s*(\n|$))/g,"").replace(/\.{3}\s*/g," ").replace(/…/g," ");
  if($("cWs").checked)t=t.replace(/[ \t\u00a0]+/g," ").replace(/ *\n */g,"\n").trim();
  if(t.length<+$("cMin").value)return;
  if($("cDup").checked){if(seen.has(t))return;seen.add(t)}
  const sents=splitSentences(t).filter(s=>s.length>=+$("cSMin").value).map(s=>({text:s,label:null}));
  if(!sents.length)return;
  const meta={};META.forEach(k=>{if(k in r)meta[k]=r[k]});
  articles.push({id:r.id??i,title:tc?r[tc]:"",meta,sents,done:false});
 });
 log(`清洗後 ${articles.length} 篇,共 ${articles.reduce((a,b)=>a+b.sents.length,0)} 句`);
 render();progress();
};
function log(m){$("log").textContent=m+"\n"+$("log").textContent}
function progress(){const d=articles.filter(a=>a.done).length;$("bar").max=articles.length||1;$("bar").value=d;$("pt").textContent=`${d}/${articles.length}`}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function callLLM(userMsg){
 const prov=$("prov").value,url=$("url").value,key=$("key").value,model=$("model").value,sys=$("prompt").value;
 let res;
 if(PROVIDERS[prov].type==="anthropic"){
  res=await fetch(url,{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
   body:JSON.stringify({model,max_tokens:4096,system:sys,messages:[{role:"user",content:userMsg}]})});
  if(!res.ok)throw new Error(res.status+" "+await res.text());
  return (await res.json()).content[0].text;
 }
 res=await fetch(url,{method:"POST",headers:{"content-type":"application/json","Authorization":"Bearer "+key},
  body:JSON.stringify({model,temperature:0,messages:[{role:"system",content:sys},{role:"user",content:userMsg}]})});
 if(!res.ok)throw new Error(res.status+" "+await res.text());
 return (await res.json()).choices[0].message.content;
}
function parseLabels(txt,n){
 const m=txt.match(/\[[\s\S]*\]/);if(!m)throw new Error("no JSON");
 const map={};JSON.parse(m[0]).forEach(o=>map[o.id]=+o.label);
 const out=[];for(let i=1;i<=n;i++){const v=map[i];if(![0,1,2].includes(v))throw new Error("missing id "+i);out.push(v)}
 return out;
}
async function labelArticle(a){
 const msg=(a.title?`Title: ${a.title}\n`:"")+a.sents.map((s,i)=>`${i+1}. ${s.text}`).join("\n");
 let err;
 for(let t=0;t<=+$("retry").value;t++){
  try{const labs=parseLabels(await callLLM(msg),a.sents.length);a.sents.forEach((s,i)=>s.label=labs[i]);a.done=true;return}
  catch(e){err=e;await sleep(1500*(t+1))}
 }
 throw err;
}
$("btnRun").onclick=async()=>{
 if(!articles.length)return alert("請先清洗資料");if(!$("key").value)return alert("請輸入 API Key");
 stop=false;const bs=Math.max(1,+$("batch").value);const todo=articles.filter(a=>!a.done);
 for(let i=0;i<todo.length&&!stop;i+=bs){
  await Promise.all(todo.slice(i,i+bs).map(a=>labelArticle(a).catch(e=>log(`文章 ${a.id} 失敗: ${e.message.slice(0,200)}`))));
  progress();render();
  if(+$("delay").value>0)await sleep(+$("delay").value);
 }
 log(stop?"已暫停":"完成");
};
$("btnStop").onclick=()=>stop=true;
function render(){
 $("view").innerHTML=articles.slice(0,100).map((a,ai)=>`<h4>#${a.id} ${(a.title||"").replace(/</g,"&lt;")} ${a.done?"✅":""}</h4><table>`+
  a.sents.map((s,si)=>`<tr class="l${s.label??""}"><td style="width:40px">${si+1}</td><td>${s.text.replace(/</g,"&lt;")}</td><td style="width:90px">
  <select onchange="articles[${ai}].sents[${si}].label=this.value===''?null:+this.value;render()">
  ${["",0,1,2].map(v=>`<option value="${v}" ${s.label===(v===""?null:v)?"selected":""}>${v===""?"-":v}</option>`).join("")}</select></td></tr>`).join("")+`</table>`).join("");
}
function download(n,c,t){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()}
function flat(){const o=[];articles.forEach(a=>a.sents.forEach((s,i)=>{if(s.label!==null)o.push({article_id:a.id,title:a.title,...a.meta,sent_idx:i+1,sentence:s.text,sentence_label:s.label})}));return o}
$("btnCsv").onclick=()=>download("labeled_sentences.csv","\ufeff"+Papa.unparse(flat()),"text/csv");
$("btnJson").onclick=()=>download("labeled.jsonl",flat().map(o=>JSON.stringify(o)).join("\n"),"application/json");
</script></body></html>
